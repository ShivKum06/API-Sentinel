<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>API Sentinel</title>
<style>
:root{font-family:system-ui,sans-serif;color:#edf2f2;background:#101417;line-height:1.45}*{box-sizing:border-box}body{margin:0;padding:28px}main{max-width:1160px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #344044;padding-bottom:20px}h1{letter-spacing:.08em;font-size:26px}h2{margin-top:0}button{border:0;background:#d6f36b;color:#101417;padding:10px 15px;font-weight:700;cursor:pointer}button.danger{background:#ff7568}.live{display:flex;gap:8px;align-items:center;color:#d6f36b;font-size:13px}.dot{width:8px;height:8px;background:#d6f36b;border-radius:50%}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:24px 0}.stat,article{border:1px solid #344044;padding:18px;background:#182024}.stat b{display:block;font-size:30px;color:#d6f36b}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid #344044}tbody tr{cursor:pointer}tbody tr:hover{background:#202b30}.risk{font-weight:800;color:#ffcf66}.detail{margin-top:18px;display:none}.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.label{color:#9eafb2;font-size:12px;text-transform:uppercase;letter-spacing:.06em}.value{font-size:20px}.reasons{padding-left:20px}.actions{display:flex;gap:10px;margin-top:18px}@media(max-width:720px){body{padding:16px}.metrics{grid-template-columns:repeat(2,1fr)}.detail-grid{grid-template-columns:1fr}}
</style>
</head>
<body><main>
<header><div><div class="live"><span class="dot"></span>LIVE MONITORING</div><h1>API SENTINEL</h1></div><button onclick="load()">Refresh</button></header>
<section class="metrics" id="stats"></section>
<article><h2>Incidents</h2><table><thead><tr><th>ID</th><th>Threat</th><th>Endpoint</th><th>Risk</th><th>Action</th></tr></thead><tbody id="incidents"></tbody></table></article>
<article class="detail" id="detail"><h2 id="detail-title"></h2><div class="detail-grid"><div><div class="label">Threat</div><div class="value" id="detail-threat"></div></div><div><div class="label">Endpoint</div><div class="value" id="detail-endpoint"></div></div><div><div class="label">Risk</div><div class="value" id="detail-risk"></div></div></div><p class="label">Why Sentinel flagged it</p><ul class="reasons" id="detail-reasons"></ul><p><span class="label">Current action</span><br><strong id="detail-action"></strong></p><div class="actions"><button onclick="overrideIncident('ALLOW')">Override: Allow</button><button class="danger" onclick="overrideIncident('BLOCK')">Keep Blocked</button></div></article>
</main>
<script>
const api='http://127.0.0.1:8000';let selected=null;
async function load(){const [stats,incidents]=await Promise.all([fetch(api+'/api/stats').then(r=>r.json()),fetch(api+'/api/incidents').then(r=>r.json())]);document.querySelector('#stats').innerHTML=[['APIs Protected',stats.apis_protected],['Requests',stats.requests],['Threats',stats.threats],['Blocked',stats.blocked],['Critical',stats.critical]].map(x=>`<div class="stat">${x[0]}<b>${x[1]}</b></div>`).join('');document.querySelector('#incidents').innerHTML=incidents.map(x=>`<tr onclick="showIncident(${x.id})"><td>INC-${x.id}</td><td>${x.threat_type}</td><td>${x.endpoint}</td><td class="risk">${x.risk_score}/100</td><td>${x.action}</td></tr>`).join('')}
async function showIncident(id){selected=await fetch(api+'/api/incidents/'+id).then(r=>r.json());const events=await fetch(api+'/api/events').then(r=>r.json());const event=events.find(x=>x.id===selected.event_id);document.querySelector('#detail').style.display='block';document.querySelector('#detail-title').textContent='INCIDENT #'+id;document.querySelector('#detail-threat').textContent=selected.threat_type;document.querySelector('#detail-endpoint').textContent=selected.endpoint;document.querySelector('#detail-risk').textContent=selected.risk_score+'/100';document.querySelector('#detail-action').textContent=selected.action;document.querySelector('#detail-reasons').innerHTML=(event?.reason||'Security rule matched').split('; ').map(x=>`<li>${x}</li>`).join('');document.querySelector('#detail').scrollIntoView({behavior:'smooth'})}
async function overrideIncident(action){if(!selected)return;await fetch(api+'/api/incidents/'+selected.id+'/override',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,reason:'Reviewed in Sentinel dashboard',reviewer:'dashboard-user'})});await load();await showIncident(selected.id)}
load();const socket=new WebSocket('ws://127.0.0.1:8000/ws/events');socket.onmessage=load;
</script></body></html>
